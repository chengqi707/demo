<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>贪吃蛇 Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --board: #1e293b;
    --grid: #253349;
    --snake-head: #4ade80;
    --snake-body: #22c55e;
    --food: #f87171;
    --text: #e2e8f0;
    --accent: #38bdf8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 { font-size: 28px; letter-spacing: 4px; }
  .scorebar {
    display: flex;
    gap: 32px;
    font-size: 18px;
  }
  .scorebar b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .stage { position: relative; }
  canvas {
    background: var(--board);
    border-radius: 12px;
    display: block;
    box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, .82);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 24px; }
  .overlay p { font-size: 14px; color: #94a3b8; line-height: 1.8; }
  .overlay .final { font-size: 18px; color: var(--text); }
  button {
    background: var(--accent);
    color: #082f49;
    border: none;
    border-radius: 8px;
    padding: 12px 36px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .1s, filter .1s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(.96); }
  .hint { font-size: 12px; color: #64748b; }
  .touchpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
  }
  .touchpad button {
    padding: 0;
    font-size: 22px;
    background: #334155;
    color: var(--text);
  }
  @media (pointer: coarse) {
    .touchpad { display: grid; }
    .hint.kbd { display: none; }
  }
</style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div class="scorebar">
    <span>得分 <b id="score">0</b></span>
    <span>最高分 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">贪吃蛇</h2>
      <p class="final" id="overlayScore"></p>
      <p id="overlayHint">方向键 / WASD 移动<br>空格 暂停 / 继续<br>手机可滑动或使用下方按钮</p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div class="touchpad">
    <span></span><button data-dir="up">▲</button><span></span>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>
  <p class="hint kbd">每吃一个食物 +10 分，速度会逐渐加快，撞墙或咬到自己即结束</p>

<script>
(() => {
  "use strict";

  // ===== 可配置参数 =====
  const GRID = 20;              // 场地 20x20 网格
  const CELL = 20;              // 每格像素
  const BASE_INTERVAL = 160;    // 初始移动间隔（毫秒）
  const MIN_INTERVAL = 70;      // 速度上限（间隔下限）
  const SPEED_STEP = 6;         // 每个食物缩短的间隔
  const SCORE_PER_FOOD = 10;

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  canvas.width = GRID * CELL;
  canvas.height = GRID * CELL;

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayScore = document.getElementById("overlayScore");
  const startBtn = document.getElementById("startBtn");

  const DIRS = {
    up:    { x: 0, y: -1 },
    down:  { x: 0, y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1, y: 0 },
  };

  let snake, dir, pendingDir, food, score, best, interval, timer, running, paused, gameOver;

  best = Number(localStorage.getItem("snake-best") || 0);
  bestEl.textContent = best;

  function reset() {
    const c = Math.floor(GRID / 2);
    snake = [{ x: c, y: c }, { x: c - 1, y: c }, { x: c - 2, y: c }];
    dir = DIRS.right;
    pendingDir = DIRS.right;
    score = 0;
    interval = BASE_INTERVAL;
    paused = false;
    gameOver = false;
    scoreEl.textContent = "0";
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    food = free[Math.floor(Math.random() * free.length)] || null;
  }

  function step() {
    dir = pendingDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙或撞到自己 → 结束
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score += SCORE_PER_FOOD;
      scoreEl.textContent = score;
      interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - Math.floor(score / SCORE_PER_FOOD) * SPEED_STEP);
      restartTimer();
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(() => { if (running && !paused) step(); }, interval);
  }

  function draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--board");
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格线
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // 食物
    if (food) {
      ctx.fillStyle = "#f87171";
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // 蛇
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#4ade80" : "#22c55e";
      const pad = i === 0 ? 1 : 2;
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function start() {
    reset();
    running = true;
    overlay.classList.add("hidden");
    draw();
    restartTimer();
  }

  function endGame() {
    running = false;
    gameOver = true;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem("snake-best", String(best));
      bestEl.textContent = best;
    }
    overlayTitle.textContent = "游戏结束";
    overlayScore.textContent = `本局得分 ${score} ｜ 最高分 ${best}`;
    startBtn.textContent = "重新开始";
    overlay.classList.remove("hidden");
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = "已暂停";
      overlayScore.textContent = "";
      startBtn.textContent = "继续";
      overlay.classList.remove("hidden");
    } else {
      overlay.classList.add("hidden");
    }
  }

  function setDir(name) {
    const d = DIRS[name];
    if (!d || !running || paused) return;
    // 禁止 180° 反向
    if (d.x === -dir.x && d.y === -dir.y) return;
    pendingDir = d;
  }

  // ===== 键盘控制 =====
  const KEYMAP = {
    ArrowUp: "up", KeyW: "up",
    ArrowDown: "down", KeyS: "down",
    ArrowLeft: "left", KeyA: "left",
    ArrowRight: "right", KeyD: "right",
  };
  document.addEventListener("keydown", e => {
    if (e.code === "Space") {
      e.preventDefault();
      if (gameOver || !running) start(); else togglePause();
      return;
    }
    const name = KEYMAP[e.code];
    if (name) { e.preventDefault(); setDir(name); }
  });

  // ===== 触屏滑动 =====
  let touchStart = null;
  document.addEventListener("touchstart", e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  }, { passive: true });

  // ===== 虚拟方向键 =====
  document.querySelectorAll(".touchpad button").forEach(btn => {
    btn.addEventListener("click", () => setDir(btn.dataset.dir));
  });

  startBtn.addEventListener("click", () => {
    if (paused) { togglePause(); } else { start(); }
  });

  // 初始画面
  reset();
  draw();
})();
</script>
</body>
</html>
