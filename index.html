<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>贪吃蛇 Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --board: #1e293b;
    --grid: #253349;
    --snake-head: #4ade80;
    --snake-body: #22c55e;
    --food: #f87171;
    --text: #e2e8f0;
    --accent: #38bdf8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 { font-size: 28px; letter-spacing: 4px; }
  .scorebar {
    display: flex;
    gap: 32px;
    font-size: 18px;
    align-items: baseline;
  }
  .scorebar b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .scorebar .fx { font-size: 15px; min-width: 90px; }
  .stage { position: relative; }
  canvas {
    background: var(--board);
    border-radius: 12px;
    display: block;
    box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, .82);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 24px; }
  .overlay p { font-size: 14px; color: #94a3b8; line-height: 1.8; }
  .overlay .final { font-size: 18px; color: var(--text); }
  button {
    background: var(--accent);
    color: #082f49;
    border: none;
    border-radius: 8px;
    padding: 12px 36px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .1s, filter .1s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(.96); }
  .hint { font-size: 12px; color: #64748b; }
  .touchpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
  }
  .touchpad button {
    padding: 0;
    font-size: 22px;
    background: #334155;
    color: var(--text);
  }
  @media (pointer: coarse) {
    .touchpad { display: grid; }
    .hint.kbd { display: none; }
  }
</style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div class="scorebar">
    <span>得分 <b id="score">0</b></span>
    <span>最高分 <b id="best">0</b></span>
    <span class="fx" id="effects"></span>
  </div>
  <div class="stage">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">贪吃蛇</h2>
      <p class="final" id="overlayScore"></p>
      <p id="overlayHint">方向键 / WASD 移动<br>空格 暂停 / 继续<br>手机可滑动或使用下方按钮<br>⭐双倍得分　🕐减速时钟　🛡️护身护盾　✂️瘦身果实</p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div class="touchpad">
    <span></span><button data-dir="up">▲</button><span></span>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>
  <p class="hint kbd">每吃一个食物 +10 分，速度会逐渐加快，撞墙或咬到自己即结束；吃到道具可获得限时增益</p>

<script>
(() => {
  "use strict";

  // ===== 可配置参数 =====
  const GRID = 20;              // 场地 20x20 网格
  const CELL = 20;              // 每格像素
  const BASE_INTERVAL = 160;    // 初始移动间隔（毫秒）
  const MIN_INTERVAL = 70;      // 速度上限（间隔下限）
  const SPEED_STEP = 6;         // 每个食物缩短的间隔
  const SCORE_PER_FOOD = 10;

  // ===== 道具系统配置 =====
  const POWERUP_TTL = 10000;    // 道具在场上存活时间（毫秒）
  const SPAWN_MIN = 15000;      // 道具刷新间隔下限
  const SPAWN_MAX = 25000;      // 道具刷新间隔上限
  const DOUBLE_MS = 10000;      // 双倍得分持续
  const SHIELD_MS = 8000;       // 护盾持续
  const TRIM_AMOUNT = 2;        // 瘦身节数
  const MIN_SNAKE_LEN = 3;      // 瘦身保底长度
  const POWERUPS = [
    { type: "double", icon: "⭐" },
    { type: "slow",   icon: "🕐" },
    { type: "shield", icon: "🛡️" },
    { type: "trim",   icon: "✂️" },
  ];

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  canvas.width = GRID * CELL;
  canvas.height = GRID * CELL;

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const effectsEl = document.getElementById("effects");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayScore = document.getElementById("overlayScore");
  const startBtn = document.getElementById("startBtn");

  const DIRS = {
    up:    { x: 0, y: -1 },
    down:  { x: 0, y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1, y: 0 },
  };

  let snake, dir, pendingDir, food, score, best, interval, timer, running, paused, gameOver;
  // 道具系统状态：以游戏内累计时间 elapsed 计时，暂停时自然冻结
  let elapsed, nextSpawnAt, powerup, doubleUntil, shieldUntil, foodEaten;

  best = Number(localStorage.getItem("snake-best") || 0);
  bestEl.textContent = best;

  const randSpawnDelay = () => SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN);

  function reset() {
    const c = Math.floor(GRID / 2);
    snake = [{ x: c, y: c }, { x: c - 1, y: c }, { x: c - 2, y: c }];
    dir = DIRS.right;
    pendingDir = DIRS.right;
    score = 0;
    interval = BASE_INTERVAL;
    paused = false;
    gameOver = false;
    elapsed = 0;
    foodEaten = 0;
    powerup = null;
    doubleUntil = 0;
    shieldUntil = 0;
    nextSpawnAt = randSpawnDelay();
    scoreEl.textContent = "0";
    effectsEl.textContent = "";
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    food = free[Math.floor(Math.random() * free.length)] || null;
  }

  // 道具生成：复用空闲格逻辑，不与蛇身、食物重叠
  function placePowerup() {
    const free = [];
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if (!snake.some(s => s.x === x && s.y === y) &&
            !(food && food.x === x && food.y === y)) free.push({ x, y });
    if (!free.length) { nextSpawnAt = elapsed + randSpawnDelay(); return; }
    const cell = free[Math.floor(Math.random() * free.length)];
    const kind = POWERUPS[Math.floor(Math.random() * POWERUPS.length)];
    powerup = { type: kind.type, icon: kind.icon, x: cell.x, y: cell.y, expiresAt: elapsed + POWERUP_TTL };
  }

  // 道具生效：同类效果重复吃到时刷新持续时间
  function applyPowerup(p) {
    if (p.type === "double") {
      doubleUntil = elapsed + DOUBLE_MS;
    } else if (p.type === "shield") {
      shieldUntil = elapsed + SHIELD_MS;
    } else if (p.type === "slow") {
      interval = BASE_INTERVAL;
      restartTimer();
    } else if (p.type === "trim") {
      for (let i = 0; i < TRIM_AMOUNT && snake.length > MIN_SNAKE_LEN; i++) snake.pop();
    }
  }

  function step() {
    elapsed += interval;

    // 道具刷新与过期（场上最多 1 个）
    if (!powerup && elapsed >= nextSpawnAt) placePowerup();
    if (powerup && elapsed >= powerup.expiresAt) {
      powerup = null;
      nextSpawnAt = elapsed + randSpawnDelay();
    }

    dir = pendingDir;
    let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙：护盾生效期间从对面穿出，否则结束
    const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
    if (hitWall) {
      if (elapsed >= shieldUntil) return endGame();
      head.x = (head.x + GRID) % GRID;
      head.y = (head.y + GRID) % GRID;
    }
    // 撞到自己 → 结束（护盾不豁免）
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      foodEaten++;
      score += SCORE_PER_FOOD * (elapsed < doubleUntil ? 2 : 1);
      scoreEl.textContent = score;
      interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - foodEaten * SPEED_STEP);
      restartTimer();
      placeFood();
    } else {
      snake.pop();
    }

    // 吃到道具（不使身体增长）
    if (powerup && head.x === powerup.x && head.y === powerup.y) {
      applyPowerup(powerup);
      powerup = null;
      nextSpawnAt = elapsed + randSpawnDelay();
    }

    draw();
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(() => { if (running && !paused) step(); }, interval);
  }

  function draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--board");
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格线
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // 食物
    if (food) {
      ctx.fillStyle = "#f87171";
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // 道具（emoji 绘制，与普通食物明显区分）
    if (powerup) {
      ctx.font = `${CELL - 2}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(powerup.icon, powerup.x * CELL + CELL / 2, powerup.y * CELL + CELL / 2 + 1);
    }

    // 蛇
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#4ade80" : "#22c55e";
      const pad = i === 0 ? 1 : 2;
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
    });

    // 护盾生效：蛇头外圈青色光环
    if (elapsed < shieldUntil) {
      ctx.strokeStyle = "#22d3ee";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(snake[0].x * CELL + CELL / 2, snake[0].y * CELL + CELL / 2, CELL / 2 + 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    // HUD：生效中的道具图标 + 剩余秒数
    let fx = "";
    if (elapsed < doubleUntil) fx += `⭐${Math.ceil((doubleUntil - elapsed) / 1000)}s `;
    if (elapsed < shieldUntil) fx += `🛡️${Math.ceil((shieldUntil - elapsed) / 1000)}s`;
    effectsEl.textContent = fx.trim();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function start() {
    reset();
    running = true;
    overlay.classList.add("hidden");
    draw();
    restartTimer();
  }

  function endGame() {
    running = false;
    gameOver = true;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem("snake-best", String(best));
      bestEl.textContent = best;
    }
    overlayTitle.textContent = "游戏结束";
    overlayScore.textContent = `本局得分 ${score} ｜ 最高分 ${best}`;
    startBtn.textContent = "重新开始";
    overlay.classList.remove("hidden");
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = "已暂停";
      overlayScore.textContent = "";
      startBtn.textContent = "继续";
      overlay.classList.remove("hidden");
    } else {
      overlay.classList.add("hidden");
    }
  }

  function setDir(name) {
    const d = DIRS[name];
    if (!d || !running || paused) return;
    // 禁止 180° 反向
    if (d.x === -dir.x && d.y === -dir.y) return;
    pendingDir = d;
  }

  // ===== 键盘控制 =====
  const KEYMAP = {
    ArrowUp: "up", KeyW: "up",
    ArrowDown: "down", KeyS: "down",
    ArrowLeft: "left", KeyA: "left",
    ArrowRight: "right", KeyD: "right",
  };
  document.addEventListener("keydown", e => {
    if (e.code === "Space") {
      e.preventDefault();
      if (gameOver || !running) start(); else togglePause();
      return;
    }
    const name = KEYMAP[e.code];
    if (name) { e.preventDefault(); setDir(name); }
  });

  // ===== 触屏滑动 =====
  let touchStart = null;
  document.addEventListener("touchstart", e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  }, { passive: true });

  // ===== 虚拟方向键 =====
  document.querySelectorAll(".touchpad button").forEach(btn => {
    btn.addEventListener("click", () => setDir(btn.dataset.dir));
  });

  startBtn.addEventListener("click", () => {
    if (paused) { togglePause(); } else { start(); }
  });

  // 初始画面
  reset();
  draw();
})();
</script>
</body>
</html>
